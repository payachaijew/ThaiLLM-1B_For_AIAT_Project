# M3Exam ภาษาไทย — ไม่มีใน lm-eval ต้องเขียนเอง
# options เป็น list ของสตริงที่ขึ้นต้นด้วย "1. ", "2. " ... จำนวนตัวเลือกไม่คงที่
# answer_text เป็นเลขตัวเลือกในรูปสตริง เช่น "4"
task: m3exam_th
dataset_path: chiayewken/m3exam
dataset_name: thai
test_split: test
fewshot_split: test
output_type: multiple_choice
doc_to_text: "{% if background %}{{background}}\n{% endif %}คำถาม: {{question_text}}\n{{options|join('\n')}}\nคำตอบ:"
doc_to_choice: "{{options}}"
doc_to_target: target_index
process_docs: !function utils.process_m3exam
num_fewshot: 5
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
